<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetGlow</title>
<meta name="description" content="NetGlow — a private notebook about the people you meet. Everything stays on your device." />
<style>
  :root {
    --ink: #291F18;
    --mid: #6C6158;
    --paper: #F8F5EE;
    --card: #FDFCF8;
    --accent: #943D00;
    --rule: rgba(41, 31, 24, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #F2EDE4;
      --mid: #B8AC9F;
      --paper: #17110C;
      --card: #1E1710;
      --accent: #EDB417;
      --rule: rgba(242, 237, 228, 0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  main {
    max-width: 480px;
    padding: 2.5rem;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }
  p.tagline {
    color: var(--mid);
    margin: 0 0 2rem;
  }
  a.link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  a.link:hover { opacity: 0.8; }
  .links {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    margin-bottom: 2.5rem;
  }
  .contact {
    text-align: left;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 1.5rem 1.75rem;
  }
  .contact h2 {
    font-size: 1rem;
    margin: 0 0 0.35rem;
  }
  .contact p.hint {
    color: var(--mid);
    font-size: 0.85rem;
    margin: 0 0 1rem;
  }
  .contact label {
    display: block;
    font-size: 0.8rem;
    color: var(--mid);
    margin: 0.75rem 0 0.25rem;
  }
  .contact input,
  .contact textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    resize: vertical;
  }
  .contact textarea { min-height: 5rem; }
  .contact button {
    margin-top: 1rem;
    width: 100%;
    font: inherit;
    font-weight: 600;
    color: var(--paper);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 0.65rem 0.7rem;
    cursor: pointer;
  }
  .contact button:hover { opacity: 0.9; }
  .contact .direct {
    display: block;
    margin-top: 0.9rem;
    font-size: 0.8rem;
    color: var(--mid);
    text-align: center;
  }
  footer {
    margin-top: 2.5rem;
    color: var(--mid);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>NetGlow</h1>
  <p class="tagline">A private notebook about the people you meet. Everything stays on your device.</p>
  <p class="links"><a class="link" href="/privacy">Privacy Policy →</a></p>

  <section class="contact" id="contact">
    <h2>Contact</h2>
    <p class="hint">Questions, feedback, or a problem to report — this opens your email app with the message filled in.</p>
    <form id="contact-form">
      <label for="c-name">Name</label>
      <input id="c-name" type="text" autocomplete="name" />

      <label for="c-message">Message</label>
      <textarea id="c-message" required></textarea>

      <button type="submit">Send email</button>
    </form>
    <a class="direct" href="mailto:netglowapp@gmail.com">or email netglowapp@gmail.com directly</a>
  </section>

  <footer>&copy; 2026 NetGlow</footer>
</main>
<script>
  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('c-name').value.trim();
    var message = document.getElementById('c-message').value.trim();
    var subject = 'NetGlow contact' + (name ? ' — ' + name : '');
    var body = message + (name ? '\n\n— ' + name : '');
    window.location.href = 'mailto:netglowapp@gmail.com'
      + '?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(body);
  });
</script>
</body>
</html>
