<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetGlow</title>
<meta name="description" content="NetGlow — a private notebook about the people you meet. Everything stays on your device." />
<style>
  :root {
    --ink: #291F18;
    --mid: #6C6158;
    --paper: #F8F5EE;
    --card: #FDFCF8;
    --accent: #943D00;
    --rule: rgba(41, 31, 24, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #F2EDE4;
      --mid: #B8AC9F;
      --paper: #17110C;
      --card: #1E1710;
      --accent: #EDB417;
      --rule: rgba(242, 237, 228, 0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  main {
    max-width: 480px;
    padding: 2.5rem;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }
  p.tagline {
    color: var(--mid);
    margin: 0 0 2rem;
  }
  a.link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  a.link:hover { opacity: 0.8; }
  footer {
    margin-top: 2.5rem;
    color: var(--mid);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>NetGlow</h1>
  <p class="tagline">A private notebook about the people you meet. Everything stays on your device.</p>
  <p><a class="link" href="/privacy">Privacy Policy →</a></p>
  <footer>&copy; 2026 NetGlow</footer>
</main>
</body>
</html>
